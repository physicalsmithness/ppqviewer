  <!-- PPQ-SYNC:TEACHER-ONLY-START (removed from the deployed copy) -->
  <div id="teacher-note"><b>Teacher preview (local).</b> Reads assets straight from PaperDatabases. The published site is the ibmathsdriller GitHub Pages copy (d014: school use, unpublicised).</div>
  <!-- PPQ-SYNC:TEACHER-ONLY-END -->
  <div id="ppq-root"></div>

  <!-- Canonical maths catalogue: generated by the Maths Categorisation seat
       (viewer/build_viewer_catalogue.py). Do not edit; re-run their builder. -->
  <script src="../../../CodexProjects/PaperDatabases/Maths Categorisation/viewer/maths_catalogue.js"></script>
  <script src="ibmaths_spine_labels.js"></script>
  <!-- Estate shared sign-in + attempt pulse (d024, Smith 2026-08-06). Until
       today this driller was published with no pulse at all, so nothing a
       pupil did here reached the shared teacher workbook. -->
  <script src="ppq-login.js"></script>
  <script src="../engine/ppqviewer.js"></script>

  <script>
  (function () {
    "use strict";
    var BASE = "file:///C:/CodexProjects/PaperDatabases/outputs/previews/";
    var TOPIC_NAMES = {
      1: "Number and algebra", 2: "Functions", 3: "Geometry and trigonometry",
      4: "Statistics and probability", 5: "Calculus"
    };
    function topicNumOf(codes) {
      var counts = {};
      (codes || []).forEach(function (c) {
        var m = String(c).match(/^(?:SL|AHL)(\d)/i);
        if (m) { var t = parseInt(m[1], 10); counts[t] = (counts[t] || 0) + 1; }
      });
      var best = -1, num = null;
      Object.keys(counts).map(Number).sort(function (a, b) { return a - b; }).forEach(function (t) {
        if (counts[t] > best) { best = counts[t]; num = t; }
      });
      return num;
    }
    function topicPartOf(code) {
      var m = String(code).match(/^((?:SL|AHL)\d+\.\d+)/i);
      return m ? m[1] : String(code);
    }

    function escHtml(s) {
      return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
    /* Smith 2026-07-29 ("don't have q stem"): the seat's text extractor drops
       display maths, leaving "[diagram/graph layout text omitted; see source
       clipping]" mid-sentence — 989 of 2195 questions. The crop below the text
       is authoritative, so the marker becomes a quiet ellipsis; the surviving
       words (conditions, definitions) still read. Real inline maths in the
       catalogue text is the seat-side fix (packet sent). */
    /* Since the 2026-08-03 regeneration the marker is the stable typed token
       `[figure]` (or `[graph]`), documented in meta.figure_marker, with
       per-part `has_figure_omitted` flags. The verbose alternation stays so a
       stale catalogue still cleans. */
    var OMIT_RE = /\s*\[[^\]]*(?:omitted|see source clipping)[^\]]*\]\s*|\s*\[(?:figure|graph)\]\s*/gi;
    /* The cleaned text keeps a quiet "…" where the extractor dropped a figure.
       Smith, 2026-08-02: "no note of diagram missing" — so say it plainly
       instead of leaving an ellipsis the reader cannot interpret. */
    var OMITTED_RE = /…/;
    function cleanStemText(s) {
      var t = String(s || "").replace(OMIT_RE, " … ")
        .replace(/\[\s*maximum mark:?\s*\d+\s*\]\s*/gi, "")   /* header already says the marks */
        .replace(/^\s*\d{1,2}\s*\.\s+/, "")                    /* header already says Qn */
        .replace(/\s+/g, " ").trim();
      /* If nothing but the ellipsis and punctuation survives, the stem says
         nothing — hide it rather than print "…". */
      return /[A-Za-z0-9]/.test(t.replace(/…/g, "")) ? t : "";
    }
    /* Part text: same cleanup, plus the label and mark tokens the part row
       already shows — "(a)" at the front and "[4]" at the end read twice. */
    function cleanPartText(label, s) {
      var t = cleanStemText(s);
      if (label) {
        var lab = String(label).toLowerCase().replace(/[^a-z0-9]/g, "");
        var m = t.match(/^\(([a-z]{1,4}|[ivx]{1,5}|\d{1,2})\)\s*/i);
        if (m && m[1].toLowerCase() === lab) t = t.slice(m[0].length);
      }
      return t.replace(/\s*\[\s*\d+\s*\]\s*\.?\s*$/, "").trim();
    }
    /* Smith 2026-07-29 ("don't have categories"): 492 legacy questions have no
       AA mapping yet, so they pooled in one "Untagged" bucket. Until the seat
       ships the legacy→AA item mapping, group them by nearest AA topic from
       their MHL codes (2014 HL core: 1 Algebra, 2 Functions, 3 Trig, 4 Vectors,
       5 Stats, 6 Calculus; options 7-10) or, pre-2008, from the option name.
       A navigation heuristic only — it never claims item-level knowledge. */
    var MHL_TOPIC = { 1: 1, 2: 2, 3: 3, 4: 3, 5: 4, 6: 5, 7: 4, 8: 1, 9: 5, 10: 1 };
    var OPTION_TOPIC = [
      [/statistics|probability/i, 4], [/calculus|differential equation/i, 5],
      [/series/i, 1], [/discrete/i, 1], [/sets|relations|groups/i, 1]
    ];
    function legacyTopicNumOf(mhlCodes, option) {
      var counts = {};
      (mhlCodes || []).forEach(function (c) {
        var m = String(c).match(/^MHL-(\d+)/i);
        if (m) { var t = MHL_TOPIC[parseInt(m[1], 10)]; if (t) counts[t] = (counts[t] || 0) + 1; }
      });
      var best = -1, num = null;
      Object.keys(counts).map(Number).sort().forEach(function (t) {
        if (counts[t] > best) { best = counts[t]; num = t; }
      });
      if (num != null) return num;
      for (var i = 0; i < OPTION_TOPIC.length; i++) {
        if (option && OPTION_TOPIC[i][0].test(option)) return OPTION_TOPIC[i][1];
      }
      return null;
    }
    /* Smith 2026-07-29: "no way people are going to know what SL1.2 is" —
       human labels generated from the syllabus spine. */
    /* The seat diagnosed Smith's "there is no friendly text on anything bar
       t1t2 etc." (2026-07-30): my generated labels are ITEM level (AHL1.12.1)
       while every surface groups at topic-part level (AHL1.12), so each lookup
       missed and fell back to the bare code. Their `meta.code_names` (135) and
       `meta.item_content` (275) are authoritative and ship in the catalogue;
       the generator is now only the last resort. */
    function spineLabel(code) {
      var M = window.MATHS_META || {}, L = window.IBMATHS_SPINE_LABELS || {};
      var CN = M.code_names || {}, IC = M.item_content || {};
      return CN[code] || IC[code] || L[code] || L[String(code).replace(/^(SL|AHL)/, "$1 ")] || "";
    }
    /* Display rule the seat asked for and Smith wants on anything a student
       sees: name first, code secondary. */
    function codeLabel(code) {
      var n = spineLabel(code);
      return n ? (n + " (" + code + ")") : String(code);
    }
    /* Seat packet, 2026-07-30 late: say what KIND of question this is before
       the student starts. An investigation or an option-booklet build is a
       different exercise from a Paper 2 question, and practising a
       non-calculator question with a calculator to hand is not the same task.
       paper_role is the richer field; calculator carries the rest. */
    var ROLE_LABEL = {
      no_calculator: "No calculator",
      calculator: "Calculator",
      option: "Option booklet",
      investigation: "Paper 3 investigation"
    };
    /* Seat ask 2: say it on the question, in words a student can act on. */
    var SPEC_STATUS_LABEL = {
      current: "On the current syllabus",
      close: "Not a current syllabus line, but the maths is",
      mixed: "Parts of this are off the current syllabus",
      out: "Off the current syllabus"
    };
    function paperKindOf(q) {
      if (ROLE_LABEL[q.paper_role]) {
        /* An option or investigation still needs the calculator rule saying. */
        /* The seat's vocabulary is permitted / not_permitted. "required" was
           my guess and never appears in the data, so until 2026-08-17 every
           one of the 553 calculator-permitted option questions printed a bare
           "Option booklet" and dropped the calculator rule the comment above
           insists on. Caught by the suite when the seat regenerated; both
           spellings accepted now so neither side's wording can silence it. */
        if (q.paper_role === "option" || q.paper_role === "investigation") {
          if (q.calculator === "not_permitted") return ROLE_LABEL[q.paper_role] + ", no calculator";
          if (q.calculator === "permitted" || q.calculator === "required") return ROLE_LABEL[q.paper_role] + ", calculator";
        }
        return ROLE_LABEL[q.paper_role];
      }
      if (q.calculator === "not_permitted") return "No calculator";
      if (q.calculator === "permitted" || q.calculator === "required") return "Calculator";
      return "";
    }

    /* ===== Markscheme page location (Smith, 2026-07-30: the reveal served the
       paper's ENTIRE markscheme "starting with the header page, completely
       nuts"). `ms_pages` is the whole document — mean 18.7 pages, up to 38,
       page 1 is the cover. The ms_crop filenames carry their source page
       ("mark_scheme_1_a_v007_p007_01_x.png"), so the pages that actually hold
       a question are DERIVABLE for the 1,355 questions with crops, and
       bracketable between located neighbours in the same paper for the rest
       (195 of 252 papers have at least half their questions located). No
       guessing beyond a stated bracket; the kind is shown to the pupil. ===== */
    var PAGE_RE = /_p(\d+)/;
    function ownMsPageNums(q) {
      var seen = {}, out = [];
      (q.parts || []).forEach(function (p) {
        (p.ms_crops || []).forEach(function (c) {
          var m = PAGE_RE.exec(c);
          if (m) { var n = parseInt(m[1], 10); if (!seen[n]) { seen[n] = 1; out.push(n); } }
        });
      });
      return out.sort(function (a, b) { return a - b; });
    }
    var MS_LOCATION = (function () {
      var byPaper = {}, loc = {};
      (window.MATHS_PPQS || []).forEach(function (q) {
        (byPaper[q.preview] = byPaper[q.preview] || []).push(q);
      });
      Object.keys(byPaper).forEach(function (prev) {
        var rows = byPaper[prev].map(function (q) {
          return { id: q.id, num: parseInt(q.question, 10) || 0, nums: ownMsPageNums(q) };
        }).sort(function (a, b) { return a.num - b.num; });
        rows.forEach(function (r, i) {
          if (r.nums.length) { loc[r.id] = { nums: r.nums, kind: "located" }; return; }
          var before = null, after = null, j, k, n;
          for (j = i - 1; j >= 0; j--) if (rows[j].nums.length) { before = rows[j].nums[rows[j].nums.length - 1]; break; }
          for (k = i + 1; k < rows.length; k++) if (rows[k].nums.length) { after = rows[k].nums[0]; break; }
          if (before != null && after != null && after >= before) {
            var band = [];
            for (n = before; n <= after; n++) band.push(n);
            loc[r.id] = { nums: band, kind: "bracketed" };
          } else loc[r.id] = { nums: [], kind: "whole" };
        });
      });
      return loc;
    })();

    /* ===== Explode each question into MARKABLE UNITS =====
       d016 (part-by-part from chemistry's model). Chemistry's past-paper
       viewer solved structured papers long ago: one record per part, part
       chips, a whole-question / part-by-part toggle, and marks entered part by
       part. Maths shipped QUESTION-level records, so a 19-mark structured
       question offered a single 0..19 bar and no way to tell which part you
       were on (Smith, 2026-07-30: "the part question stuff is just not
       serving"). The engine has carried chemistry's `structuredPaper` module
       since Phase 3 (d001); this consumer simply never used it.

       A UNIT is what one marks entry covers: normally one part, but parts the
       seat marked TOGETHER become one unit worth their combined marks — e.g.
       10(b)(i) 0 marks `unallocated_companion` + 10(b)(ii) 7 marks
       `combined_on_sibling`, same `mark_group`, is one 7-mark unit. Per the
       seat's switching rules (mark-groups packet, 2026-07-29) part-level entry
       applies only where every unit carries a positive mark total; the 2004-07
       structural-loss papers (blank marks, no status) stay question-level as a
       single unit, and single-part questions keep their original id so their
       stored history survives. Unit ids are `<qid>(<slug>)` so the engine's
       block detection groups them. ===== */
    function partSuffixOf(label, qnum) {
      var t = String(label == null ? "" : label).trim();
      if (qnum) t = t.replace(new RegExp("^\\s*" + qnum + "(?![0-9])"), "").trim();
      return t;
    }
    function unitLabelOf(members, qnum) {
      var bits = members.map(function (p) { return partSuffixOf(p.label, qnum); }).filter(Boolean);
      if (!bits.length) return "";
      return bits.length > 1 ? (bits[0] + "–" + bits[bits.length - 1]) : bits[0];
    }
    function partLetterOf(label) {
      var m = /\(([A-Za-z]+)\)/.exec(String(label == null ? "" : label));
      return m ? m[1].toLowerCase() : "";
    }
    /* Seat packet 2026-08-03: 126 questions across 86 papers carry the
       roman-gap signature ((i)/(iii)/(v) with the even romans missing), a
       part-LABEL extraction fault. Where that signature is present, a
       blank-mark part is itself suspect, so absorbing it into a marked
       neighbour (below) would mask corruption rather than repair an
       extraction miss. Gate: such questions stay question-level until the
       seat's X03 label repair ships. */
    var ROMAN_VAL = { i: 1, ii: 2, iii: 3, iv: 4, v: 5, vi: 6, vii: 7, viii: 8, ix: 9, x: 10 };
    function romanGapIn(parts) {
      var byLetter = {};
      (parts || []).forEach(function (p) {
        var toks = String(p.label == null ? "" : p.label).match(/\(([A-Za-z]+)\)/g) || [];
        toks = toks.map(function (t) { return t.replace(/[()]/g, "").toLowerCase(); });
        var letter = "";
        for (var i = 0; i < toks.length; i++) {
          if (!ROMAN_VAL[toks[i]]) { letter = toks[i]; break; }
        }
        toks.forEach(function (t) {
          if (t !== letter && ROMAN_VAL[t]) {
            (byLetter[letter] = byLetter[letter] || []).push(ROMAN_VAL[t]);
          }
        });
      });
      return Object.keys(byLetter).some(function (L) {
        var seen = {}, vs = [];
        byLetter[L].forEach(function (v) { if (!seen[v]) { seen[v] = 1; vs.push(v); } });
        vs.sort(function (a, b) { return a - b; });
        return vs.length > 0 && vs[vs.length - 1] > vs.length;
      });
    }
    function unitsOf(q) {
      var parts = q.parts || [];
      if (parts.length < 2) return null;
      var order = [], byGroup = {};
      parts.forEach(function (p, i) {
        var key = p.mark_group ? ("g:" + p.mark_group) : ("s:" + i);
        if (!byGroup[key]) { byGroup[key] = { members: [], marks: 0 }; order.push(byGroup[key]); }
        byGroup[key].members.push(p);
        byGroup[key].marks += parseInt(p.marks, 10) || 0;
      });
      /* A zero-mark unit sitting inside a MARKED run of the same printed part
         is an extraction miss, not a separate task: e.g. 2222-7107 P2 Q12 has
         12(c)(ii) blank while 12(c)(i)/(iii)/(v) share a 12-mark group, which
         would demote the whole 19-mark question to one marks bar. Absorb it
         into the neighbouring unit that shares its part letter. No marks are
         invented — the group total is the printed one. This lifts part-level
         questions from 1,063 to 1,459, and from 425 to 763 of the 862
         questions worth 10 marks or more, which is where the pain was. */
      var anyBlank = order.some(function (u) { return !(u.marks > 0); });
      if (anyBlank && romanGapIn(parts)) return null; /* gated: labels corrupt, packet 2026-08-03 */
      var changed = true;
      while (changed) {
        changed = false;
        for (var i = 0; i < order.length && !changed; i++) {
          if (order[i].marks > 0) continue;
          var mine = order[i].members.map(function (m) { return partLetterOf(m.label); });
          for (var d = 0; d < 2 && !changed; d++) {
            var j = d === 0 ? i - 1 : i + 1;
            if (j < 0 || j >= order.length || !(order[j].marks > 0)) continue;
            var theirs = order[j].members.map(function (m) { return partLetterOf(m.label); });
            var shared = mine.some(function (L) { return L && theirs.indexOf(L) >= 0; });
            if (!shared) continue;
            order[j].members = order[j].members.concat(order[i].members).sort(function (a, b) {
              return parts.indexOf(a) - parts.indexOf(b);
            });
            order.splice(i, 1);
            changed = true;
          }
        }
      }
      if (order.length < 2) return null;
      /* Remaining zero-mark unit = the 2004-07 structural-loss era (blank marks,
         no status), which the seat is reconstructing in Phase 2. Question-level
         until then; these flip to part-level with no code change when it lands. */
      for (var k = 0; k < order.length; k++) if (!(order[k].marks > 0)) return null;
      return order;
    }

    /* ===== Which codes does a PUPIL see? (Smith, 2026-08-17) =====
       The seat ships two code fields and they mean different things. Their
       packet: `aa_codes_today` is "the spine codes the question would carry if
       set today, from the lineage judgement; distinct from the classification's
       historical codes". So `aa_codes` is what a question was tagged as under
       its own syllabus generation, and `aa_codes_today` is the judged answer to
       what it actually tests in the current course.

       Everything a pupil meets is expressed in the CURRENT syllabus: the
       Learned-so-far tick tree, the topic chip, the filters, the weak-area
       chips. So the judged code wins wherever it exists, and the historical
       one is the fallback, not the other way round.

       This was backwards until today, and it was not cosmetic. Smith un-ticked
       complex numbers in Learned so far and was still served
       `8804-7401_Q13` ("solve z³ − 8i = 0"), because that record's historical
       codes are SL2.10.1 and SL3.8.1 (equation solving, trigonometry) while its
       judged code is AHL1.14.2, complex numbers, and the scope filter read only
       the historical field with no fallback at all. 62 legacy records have the
       two fields pointing at different topics, and a further 103 carry ONLY a
       judged code, so the scope tree could not place them at all. The 463
       current-syllabus AAHL records carry no judged codes and are unaffected by
       the swap. */
    function currentCodes(q) {
      var judged = (q && q.aa_codes_today) || [];
      if (judged.length) return judged;
      return (q && q.aa_codes) || [];
    }

    var questions = [];
    (window.MATHS_PPQS || []).forEach(function (q) {
      var tnum = topicNumOf(currentCodes(q));
      if (tnum == null) tnum = legacyTopicNumOf(q.mhl_codes, q.option);
      var subtopics = [];
      currentCodes(q).forEach(function (c) {
        var tp = topicPartOf(c);
        if (subtopics.indexOf(tp) < 0) subtopics.push(tp);
      });
      var msAll = (q.ms_pages || []).map(function (c) { return BASE + q.preview + "/" + c; });
      /* The seat shipped per-question page sets on 2026-07-30 (2,021 of 2,195
         questions, 1.8 pages on average against the whole document's 18.7),
         which supersedes my crop-filename locator. Theirs first, mine as the
         fallback for the 174 they could not span, whole paper last. The whole
         document always stays available one click deeper, because a narrowed
         set can clip (their `located-medium` is explicitly capped). */
      var msNarrow = (q.ms_pages_this_question || []).map(function (c) { return BASE + q.preview + "/" + c; });
      var msKind = msNarrow.length ? (q.ms_page_span_source || "located") : "";
      if (!msNarrow.length) {
        var where = MS_LOCATION[q.id] || { nums: [], kind: "whole" };
        msNarrow = msAll.filter(function (u) {
          var m = PAGE_RE.exec(u);
          return m && where.nums.indexOf(parseInt(m[1], 10)) >= 0;
        });
        msKind = where.kind;
      }
      /* ===== Front-matter guard (Smith, 2026-08-17) =====
         Every IB markscheme opens with a cover, a copyright/blank page and
         Instructions to Examiners, so a "located" set lying entirely inside
         the first three pages cannot be a question's marking. On 2026-08-17 a
         locator fault put 379 records across 31 papers into exactly that
         state: Smith revealed the markscheme for an M16 six-marker and got the
         M/A/R/N abbreviations page, presented with full confidence because
         `located-high` and `aligned` were indistinguishable to me at render
         time. The seat has since re-run the locator and the corpus is clean,
         which is precisely why this stays: it is cheap, it is knowably true,
         and it turns a silent recurrence into a visible fallback instead of a
         wrong answer in front of a pupil. Deliberately conservative at three
         pages; some papers run preamble to page six, but three is the part no
         markscheme can contradict. */
      var MS_FRONT_MATTER = 3;
      if (msNarrow.length) {
        var allFrontMatter = msNarrow.every(function (u) {
          var m = PAGE_RE.exec(u);
          return m && parseInt(m[1], 10) <= MS_FRONT_MATTER;
        });
        if (allFrontMatter) { msNarrow = []; msKind = ""; }
      }
      if (!msNarrow.length) { msNarrow = msAll; msKind = "whole"; }

      var qnum = String(q.question == null ? "" : q.question).trim();
      var common = {
        block_id: q.id,
        paper_code: q.paper_code, syllabus: q.syllabus,
        year: parseInt(q.year, 10) || q.year, session: q.session, time_zone: q.time_zone,
        paper: q.paper, question: q.question,
        question_marks: parseInt(q.marks, 10) || 1,
        aa_applicable: q.aa_applicable || "",
        option: q.option || "",
        skill_demand: q.skill_demand || "",
        /* Seat packet, 2026-07-30 late: "a non-calculator question practised
           with a calculator to hand is not the same exercise", and a P3
           investigation is not a long P2 question. Shown before the attempt,
           not only as a filter. */
        calculator: q.calculator || "",
        paper_role: q.paper_role || "",

      },

      selfAssess: {
        /* d012 taxonomy, restructured per Smith 2026-07-29: the way-in block
           first, then Stuck algebraically (only when algebra is really there —
           interim gate until the seat's techniques axis lands), then Annoying
           slips BELOW. Communication removed until a communication mark exists
           in the data. Suggest-a-category sits above Other (engine-side). */
        taxonomy: [
          { group: "Couldn't find a way in", tags: [
            "Couldn't find a way in", "Saw half the way in", "Got halfway there"
          ]},
          { group: "Stuck algebraically",
            when: function (q) {
              if (q.topic_num === 1 || q.topic_num === 2 || q.topic_num === 5) return true;
              var hay = ((q.question_types || []).join(" ") + " " + (q.themes || []).join(" ") + " " + (q.skill_demand || "")).toLowerCase();
              return /algebra|equation|expression|polynomial|logarith|factor|simplif/.test(hay);
            },
            tags: [
              "Didn't spot factorising", "Took an unhelpful route",
              "Expanded when I should have factorised", "Didn't see I had to gather terms",
              "Didn't spot the hidden quadratic", "Didn't spot taking logs",
              "Stuck on the algebra"
            ]},
          { group: "Annoying slips", tags: [
            "Didn't read the question carefully",
            "Algebraic slip (written)", "Algebraic slip (mental)", "Mental arithmetic",
            "Calculator", "Miscopied or mistyped"
          ]},
          /* Smith, 2026-08-02: "I may not have shown the right working or
             missed working points." A maths mark is often lost with the right
             answer on the page, which none of the existing groups could say.
             Interim vocabulary: the seat's markpoints (6,207 parts) will let a
             pupil point at the exact credited step they missed instead, which
             is the redesign recorded in d017. */
          { group: "Working and communication", tags: [
            "Got the answer but didn't show enough working",
            "Missed a method mark I could have shown",
            "Didn't state the conclusion",
            "Didn't justify a step the markscheme wanted"
          ]}
        ],
        weakAreasOf: function (q) {
          return (q.subtopics || []).map(function (tp) {
            return { value: tp, label: "Not solid: " + codeLabel(tp), weak: false };
          });
        }
      },

      attemptFields: function (q) {
        return {
          paper_code: q.paper_code, syllabus: q.syllabus, year: q.year, paper: q.paper,
          question: q.question, topic_code: q.topic_code,
          block_id: q.block_id, part_label: q.part_label || "", marks_max: q.marks
        };
      },
      selfReport: { levels: 6, prompt: "How did that feel? (1 = lost, 6 = easy)" },
      /* No analysisOf: with no feedback source the readiness badge hides
         entirely (Smith: "Solution pending" on every maths question was noise). */
      /* d016: structuredPaper is chemistry's multipart navigator, in the engine
         since Phase 3 (d001) and unused by this consumer until now. */
      modules: { postQuestionReview: true, structuredPaper: true }
    };

    /* d024 (sign-in gate and pulse on every consumer, Smith 2026-08-06). The
       class list is INTERIM, exactly as ESAT's is, and stays so until q08
       names the real class source. If ppq-login.js failed to load the driller
       still opens, ungated and silent, because being locked out of revision is
       worse than an unreported session. */
    var INTERIM_CLASSES = ["Test", "Y12 Maths", "Y13 Maths"];
    var gate = (window.PPQLogin && window.PPQLogin.mountGate) ? window.PPQLogin.mountGate({
      title: "IB Maths Past-Paper Driller",
      projectTag: "ppqviewer_ibmaths",
      cohortKey: "ppqviewer_ibmaths_cohort_v1",
      classes: INTERIM_CLASSES,
      appEl: "ppq-root"
    }) : null;
    if (!gate) document.getElementById("ppq-root").style.display = "block";

    PPQViewer.mount(document.getElementById("ppq-root"), {
      config: window.PPQ_CONFIG,
      questions: questions,
      meta: window.MATHS_META || {},
      report: gate ? gate.report : null
    });
  })();
  </script>
</body>
