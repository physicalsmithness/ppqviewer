<body>
  <!-- PPQ-SYNC:TEACHER-ONLY-START (removed from a deployed copy, when one exists) -->
  <div id="teacher-note"><b>Teacher preview (local).</b> Reads assets straight from PaperDatabases. Economics is not published: the deployment repository and the publication ruling both need Smith.</div>
  <!-- PPQ-SYNC:TEACHER-ONLY-END -->
  <div id="ppq-root"></div>

  <!-- Canonical economics catalogue: generated by the IB Economics Categorisation
       seat (viewer/build_economics_catalogue.py). Do not edit; re-run their
       builder. window.ECON_META + window.ECON_QUESTIONS, 1,021 records. -->
  <script src="../../../CodexProjects/PaperDatabases/Economics Categorisation/viewer/economics_catalogue.js"></script>
  <script src="../engine/ppqviewer.js"></script>

  <script>
  (function () {
    "use strict";

    /* =================================================================
       ASSETS
       The delivery packet (inbox\2026-08-03_from-economics_catalogue-
       delivered.md) says assets are "bare filenames from
       outputs\previews\<preview>\{crops,pages}". They are: crops,
       stem_crops and ms_crops live in <preview>/crops/, while pages and
       ms_pages live in <preview>/pages/. Verified against every one of
       the 23,052 asset references in the catalogue — zero missing, zero
       in the other folder, zero at the preview root. The flat
       BASE + preview + "/" + filename that ibmaths uses does NOT work
       here: the maths corpus is flat and the economics corpus is not.
       ================================================================= */
    var BASE = "file:///C:/CodexProjects/PaperDatabases/outputs/previews/";
    function cropUrl(preview, f) { return BASE + preview + "/crops/" + f; }
    function pageUrl(preview, f) { return BASE + preview + "/pages/" + f; }

    var META = window.ECON_META || {};
    var CODE_NAMES = META.code_names || {};
    var PAPER_REPORTS = META.paper_reports || {};

    function escHtml(s) {
      return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    /* =================================================================
       EXTRACTION TOKENS THAT MUST NEVER REACH A PUPIL
       The catalogue contract (tier 1, point 3) makes the omitted-figure
       marker a TYPED token so the viewer can render it as a quiet
       ellipsis with the crop as the authority. Economics declares
       meta.figure_marker = "[figure]" and sets per-part
       has_figure_omitted, and the token appears 435 times.
       Three more token families are in this data and are NOT declared
       anywhere, so they are handled here and asserted against in the
       suite:
         · "[answer space]"  (338 parts) — the printed answer lines
         · "[2]" / "[2 marks]" — the mark allocation, which the card
           header already states, so it reads twice
         · "removed for copyright reasons" prose in five wordings
           (38 records, 49 parts) — the IB redacted the source material
           in the published paper, so this is a real fact about the
           question and gets a notice, not a silent deletion.
       ================================================================= */
    var FIGURE_TOKEN = META.figure_marker || "[figure]";
    /* Detectors (non-global, safe to .test repeatedly). */
    var HAS_FIGURE = /\[(?:figure|graph|diagram|image|table)\]/i;
    var HAS_REDACTION = /(?:removed|redacted)\s+for\s+copyright\s+reasons/i;
    /* Strippers (global; each replace() call resets its own lastIndex). */
    var REDACT_RE = /\s*\[?\s*(?:content|text|figures?|questions?|tables?|extracts?|images?)?\s*(?:removed|redacted)\s+for\s+copyright\s+reasons\.?\s*\]?\s*/gi;
    var REFER_RE = /\s*\[\s*please refer to [^\]]*\]\s*/gi;
    var FIGURE_RE = /\s*\[(?:figure|graph|diagram|image|table)\]\s*/gi;
    var ANSWER_SPACE_RE = /\s*\[\s*answer space\s*\]\s*/gi;
    var MARKS_TOKEN_RE = /\s*\[\s*\d{1,3}\s*(?:marks?)?\s*\]\s*/gi;
    /* The ellipsis the figure token leaves behind, so the block can say
       plainly that something is missing rather than printing a "…" the
       reader cannot interpret (Smith, 2026-08-02: "no note of diagram
       missing"). */
    var OMITTED_RE = /…/;

    function stripTokens(s) {
      return String(s == null ? "" : s)
        .replace(REDACT_RE, " ")
        .replace(REFER_RE, " ")
        .replace(FIGURE_RE, " … ")
        .replace(ANSWER_SPACE_RE, " ")
        .replace(MARKS_TOKEN_RE, " ");
    }
    /* A markscheme keeps its mark allocations: "[2]" beside a band is the
       award, not the duplicated header the question text carries. Everything
       else that must not reach a pupil still goes. */
    function stripTokensInScheme(s) {
      return String(s == null ? "" : s)
        .replace(REDACT_RE, " ")
        .replace(REFER_RE, " ")
        .replace(FIGURE_RE, " … ")
        .replace(ANSWER_SPACE_RE, " ");
    }
    function tidy(s) {
      var t = stripTokens(s)
        .replace(/^\s*\d{1,2}\s*\.\s+/, "")     /* the card header already says Qn */
        .replace(/\s+/g, " ")
        .trim();
      /* If only the ellipsis and punctuation survive, the text says nothing. */
      return /[A-Za-z0-9]/.test(t.replace(/…/g, "")) ? t : "";
    }
    /* Part text additionally loses the "(a) (i)" prefix that the part row
       already shows. Only tokens that are actually in this part's label
       are stripped, so a genuine "(i)" inside the sentence survives. */
    function tidyPart(label, s) {
      var t = tidy(s);
      var own = {};
      (String(label == null ? "" : label).match(/\(([A-Za-z0-9]+)\)/g) || []).forEach(function (tok) {
        own[tok.replace(/[()]/g, "").toLowerCase()] = true;
      });
      var m;
      while ((m = /^\(\s*([A-Za-z0-9]{1,4})\s*\)\s*/.exec(t))) {
        if (!own[m[1].toLowerCase()]) break;
        t = t.slice(m[0].length);
      }
      return t.trim();
    }

    /* =================================================================
       HUMAN NAMES BEFORE CODES (catalogue contract, tier 1, point 4)
       meta.code_names is a 518-row map, and every one of the 14,079 code
       references in the catalogue resolves in it, so no observed code
       can fall through to a bare "1.2.1.b".
       83 of the names arrive wrapped in square brackets
       ("[The law of demand—…]"), which on screen reads as one more
       extraction token, so the wrapper unwraps them.
       LIMITATION, and a request for the seat: code_names has NO entries
       at unit (1-segment) or topic (2-segment) level — every key is 4, 5
       or 6 segments deep. The syllabus therefore cannot be rolled up
       through it. Unit names below are the four IB Economics (2020)
       units, which are also verifiable from the content of each unit's
       own code_names; the 32 topic-level headings (2.11, 3.4, …) have no
       name available at all, so this consumer does not offer a
       topic-level surface. Asking the seat for unit and topic names in
       code_names is the fix.
       ================================================================= */
    function codeName(code) {
      var n = CODE_NAMES[code];
      if (!n) return "";
      n = String(n).trim();
      if (/^\[.*\]$/.test(n)) n = n.slice(1, -1).trim();
      return n;
    }
    function codeLabel(code) {
      var n = codeName(code);
      return n ? (n + " (" + code + ")") : String(code);
    }
    function shortCodeLabel(code) {
      var n = codeName(code);
      if (!n) return String(code);
      if (n.length > 70) n = n.slice(0, 67).replace(/[\s,;:—-]+$/, "") + "…";
      return n + " (" + code + ")";
    }
    var UNIT_NAMES = {
      "1": "Introduction to economics",
      "2": "Microeconomics",
      "3": "Macroeconomics",
      "4": "The global economy"
    };
    var UNMAPPED = "unmapped";
    function unitOf(code) {
      var u = String(code == null ? "" : code).split(".")[0];
      return UNIT_NAMES[u] ? u : UNMAPPED;
    }
    var UNIT_FRIENDLY = { };
    Object.keys(UNIT_NAMES).forEach(function (u) { UNIT_FRIENDLY[u] = "Unit " + u + " " + UNIT_NAMES[u]; });
    /* 25 records (all 2004 Paper 1 multiple-choice) carry no codes at all.
       They are not hidden; they are named for what they are. */
    UNIT_FRIENDLY[UNMAPPED] = "Not yet mapped to a syllabus unit";

    /* Vocabulary the pupil reads instead of the raw field values. Every
       observed value of question_type and ao_focus is named here; the
       suite asserts that, so a regenerated catalogue with a new value
       fails loudly instead of showing "essay_b_evaluate" to a pupil. */
    var UNCLASSIFIED = "unclassified";
    var QTYPE_LABEL = {
      define: "Define a term",
      identify: "Identify from the data",
      list: "List",
      calculate: "Calculation",
      show_that: "Show that",
      explain_short: "Short explanation",
      diagram_explain: "Explain, using a diagram",
      diagram_sketch: "Sketch a diagram",
      draw_on_figure: "Draw on the figure given",
      recommend: "Recommend a policy",
      essay_a_explain: "Essay, part (a): explain",
      essay_b_evaluate: "Essay, part (b): evaluate",
      data_explain: "Data response: explain",
      data_essay: "Data response essay",
      multiple_choice: "Multiple choice",
      unclassified: "Not yet classified"
    };
    /* The IB assessment objectives, spelled out. */
    var AO_LABEL = {
      "AO1": "AO1 knowledge and understanding",
      "AO2": "AO2 application and analysis",
      "AO1/AO2": "AO1 and AO2 knowledge, application and analysis",
      "AO2/AO4": "AO2 and AO4 application, analysis and skills",
      "AO3/AO4": "AO3 and AO4 synthesis, evaluation and skills",
      "unclassified": "Not yet classified"
    };
    var LEVEL_LABEL = {
      HL: "Higher level",
      SL: "Standard level",
      /* 16 records, all 2024–25 Paper 2: one paper sat by both cohorts. */
      HLSL: "Common to Higher and Standard level"
    };
    /* Deliberately bare. The obvious labels — Paper 1 "extended response",
       Paper 2 "data response", Paper 3 "HL policy paper" — describe the
       CURRENT paper structure and are wrong for most of this corpus: the 2004
       Paper 1 was 40 multiple-choice items, and Paper 3 existed in a different
       form before 2022. 738 of the 1,021 records predate the current
       structure. The one era description the catalogue states outright is
       marking_era's "MCQ era", so that is the only one said, and it is said on
       the question rather than in the filter. Per-era paper names would be a
       good thing to have from the seat. */
    var PAPER_LABEL = { "1": "Paper 1", "2": "Paper 2", "3": "Paper 3" };
    function paperKindOf(q) {
      return PAPER_LABEL[q.paper] +
        (q.paper === "1" && /MCQ era/i.test(q.marking_era) ? " (multiple choice)" : "");
    }
    /* meta.spec_status_legend, said to a pupil rather than to a builder.
       d020: the driller defaults to the practisable subset. */
    var SPEC_LABEL = {
      current: "On the current syllabus",
      mixed: "The topic survives, but the wording or emphasis changed",
      out: "Off the current syllabus"
    };

    /* =================================================================
       MCQ (dispatch config decision 2)
       80 legacy 2004 Paper 1 items carry question_type
       "multiple_choice". The catalogue ships NO choices[] and NO answer
       key field: the four options are inside the part text as
       "A. … B. … C. … D. …", and the answer is the whole of
       markscheme_text ("Answer: C"). Both are therefore parsed here.
       The parse is deliberately strict — all four letters, in order,
       each with real text after it, and a stem worth reading in front of
       them. 73 of the 80 pass. The other 7 are OCR damage (option
       tables read bottom-to-top, or an option list truncated mid-way),
       and a garbled option list presented as a live multiple-choice
       question would be the viewer lying to a pupil, so they fall back
       to the ordinary 1-mark self-assessment against the printed crop.
       This is a wrapper-side derivation, not an engine change: the
       engine's mcq type asks for choicesOf() and answerKeyOf() and that
       is all it is given.
       ================================================================= */
    function parseMCQ(text, msText) {
      var key = (String(msText || "").match(/answer\s*[:\-]?\s*([A-D])\b/i) || [])[1];
      if (!key) return null;
      var t = String(text || "");
      var re = /(^|[\s(])([A-D])\.\s+/g, m, first = {}, hits = [];
      while ((m = re.exec(t))) {
        var L = m[2];
        if (first[L] == null) { first[L] = m.index + m[1].length; hits.push({ L: L, at: m.index + m[1].length, end: re.lastIndex }); }
      }
      var want = ["A", "B", "C", "D"];
      for (var i = 0; i < want.length; i++) if (first[want[i]] == null) return null;
      if (!(first.A < first.B && first.B < first.C && first.C < first.D)) return null;
      var starts = want.map(function (L) {
        for (var j = 0; j < hits.length; j++) if (hits[j].L === L) return hits[j];
        return null;
      });
      var choices = starts.map(function (s, i2) {
        var end = i2 < 3 ? starts[i2 + 1].at : t.length;
        return tidy(t.slice(s.end, end));
      });
      for (var c = 0; c < choices.length; c++) if (choices[c].length < 2) return null;
      var stem = tidy(t.slice(0, starts[0].at));
      if (stem.replace(/[^A-Za-z0-9]/g, "").length < 12) return null;
      return { key: key.toUpperCase(), choices: choices, stem: stem };
    }

    /* =================================================================
       PART IDENTITY (dispatch config decision 5)
       The catalogue ships no part_id. It is synthesised here from the
       record id and the printed part label.

       ATTEMPTS ARE KEYED ON THIS STRING. It must never change: a change
       silently orphans every stored attempt, score and flag for that
       part, and the pupil's history for it disappears.

       The dispatch asked for "<record id>_<label>". That form cannot be
       used, because the engine's part navigator finds a question's
       siblings with
           id === blockKey || id.startsWith(blockKey + "(")
       (_blockParts, engine line 5183). An underscore-joined id matches
       neither, so structuredPaper would silently render nothing on all
       817 multi-part questions. The separator is therefore the engine's
       "(", exactly as ibmaths.html does it, and the inside of the
       brackets is the label with the leading question number removed and
       non-alphanumerics collapsed: "22M.P2.HL.Q1" + "(a_ii)".
       Verified deterministic and collision-free across all 3,498 parts.

       When the seat ships a real part_id, it becomes the string inside
       the brackets (partSlug below returns it), so the engine contract
       still holds and only the inner token changes. */
    function partSuffix(label, qnum) {
      var t = String(label == null ? "" : label).trim();
      if (qnum) t = t.replace(new RegExp("^\\s*" + qnum + "(?![0-9])"), "").trim();
      return t;
    }
    function partSlug(part, label, qnum, index) {
      if (part && part.part_id) return String(part.part_id).replace(/[^A-Za-z0-9]+/g, "_");
      var sfx = partSuffix(label, qnum);
      return sfx.replace(/[^A-Za-z0-9]+/g, "_").replace(/^_+|_+$/g, "") || ("p" + (index + 1));
    }

    /* =================================================================
       BUILD THE MARKABLE UNITS (dispatch config decision 4)
       d016, part-by-part from chemistry's model. This data has no
       mark_group and no marks_status, so every part is its own unit and
       there is nothing to merge. A single-part record keeps its ORIGINAL
       id, so the navigator does not appear for it and its stored history
       is not disturbed. 204 records are single-part, 817 are not.
       ================================================================= */
    var questions = [];
    var ITEM_NAMES = {};   /* every observed code, named, for the dependent filter */
    var STATS = { specDefaulted: 0, mcqParsed: 0, mcqFellBack: 0, marksMissing: 0, redacted: 0, bandsThin: 0 };

    (window.ECON_QUESTIONS || []).forEach(function (q) {
      var parts = q.parts || [];
      if (!parts.length) return;
      var qnum = String(q.question == null ? "" : q.question).trim();
      /* d020 + dispatch config decision 8: an empty spec_status is read as
         current. 124 records. Recorded in STATS and asserted in the suite
         so the number cannot drift unnoticed. */
      var spec = String(q.spec_status || "").trim();
      if (!spec) { spec = "current"; STATS.specDefaulted++; }

      /* Every question page for the whole question, in page order. The
         stem sits above the first part on the first of them, and the
         printed page is the only faithful account of a data-response
         extract's tables and figures. Held at question level so every
         part shows the same printed context (d018). */
      var qPages = [];
      parts.forEach(function (p) {
        (p.pages || []).forEach(function (f) {
          if (!/^question_/.test(f)) return;   /* contract tier 1, point 2 */
          var u = pageUrl(q.preview, f);
          if (qPages.indexOf(u) < 0) qPages.push(u);
        });
      });
      qPages.sort();
      /* The union of every markscheme page this question touches. The
         per-part ms_pages are already narrow (the seat located them), so
         this is the "and the rest of it" set one click deeper. */
      var msAll = [];
      parts.forEach(function (p) {
        (p.ms_pages || []).forEach(function (f) {
          var u = pageUrl(q.preview, f);
          if (msAll.indexOf(u) < 0) msAll.push(u);
        });
      });
      msAll.sort();

      /* The stem. On a Paper 2 or Paper 3 data-response question it is the
         extract, and it is the whole point. On a Paper 1 essay it is
         literally the two parts concatenated — 638 of the 1,021 records
         have a stem that adds nothing at all once the part texts are taken
         out of it — and printing it would ask the pupil to read the same
         sentence twice, immediately. So the stem renders only when
         something of it survives that is not already in a part.
         (ibmaths deliberately prints both, per d015, because there the
         duplicate is Smith's cross-check against poor OCR. That reasoning
         does not carry: this is not OCR variance, it is the same string.) */
      var stemClean = tidy(q.stem_text);
      var stemResidue = stemClean.toLowerCase().replace(/[^a-z0-9]+/g, " ");
      parts.forEach(function (p) {
        var pt = tidy(p.text).toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
        if (pt && stemResidue.indexOf(pt) >= 0) stemResidue = stemResidue.replace(pt, " ");
      });
      var stemAdds = stemResidue.replace(/\s+/g, " ").trim().length >= 40;
      var stemText = stemAdds ? stemClean : "";
      var stemRedacted = HAS_REDACTION.test(q.stem_text || "");
      if (stemRedacted) STATS.redacted++;

      var report = PAPER_REPORTS[q.preview] || null;
      /* The record's own `marks` is the sum of its parts' marks, so on the 127
         records with a part whose printed marks did not survive, the total is
         short by exactly that part and is NOT the printed whole-question
         total. A stated total that contradicts the printed one is worse than
         no total, so the "of N for the whole question" clause is withheld
         there (ibmaths guards the same way for the same reason). */
      var marksComplete = parts.every(function (p) { return parseInt(p.marks, 10) > 0; });

      var common = {
        block_id: q.id,
        preview: q.preview,
        year: q.year, year_num: parseInt(q.year, 10) || 0,
        series: q.series, time_zone: q.time_zone || "",
        paper: String(q.paper), level: q.level,
        question: qnum,
        question_marks: parseInt(q.marks, 10) || 0,
        question_marks_complete: marksComplete,
        spec_status: spec,
        spec_status_source: q.spec_status_source || "",
        marking_era: q.marking_era || "",
        marking_differs: q.marking_differs || "",
        marking_note: String(q.marking_note || "").trim(),
        stem_text: stemText,
        stem_redacted: stemRedacted,
        question_pages_all: qPages,
        ms_pages_all: msAll,
        paper_report: report
      };

      var single = parts.length === 1;
      parts.forEach(function (p, i) {
        var label = partSuffix(p.label, qnum);
        var id = single ? q.id : (q.id + "(" + partSlug(p, p.label, qnum, i) + ")");
        var marks = parseInt(p.marks, 10);
        var hasMarks = marks > 0;
        if (!hasMarks) STATS.marksMissing++;

        var mcq = null;
        if (p.question_type === "multiple_choice") {
          mcq = parseMCQ(p.text, p.markscheme_text);
          if (mcq) STATS.mcqParsed++; else STATS.mcqFellBack++;
        }

        var codes = [].concat(p.primary_codes || [], p.secondary_codes || []).filter(function (c, k, a) {
          return c && a.indexOf(c) === k;
        });
        codes.forEach(function (c) { if (!ITEM_NAMES[c]) ITEM_NAMES[c] = shortCodeLabel(c); });
        /* The unit is THIS PART's, not the whole question's. The markable
           unit is the part (d016), and a data-response question walks the
           syllabus: 300 of the 1,021 records have parts in more than one
           unit, and 764 parts — 22% of the corpus — sit in a different unit
           from their record's primary_code. Taking the record's unit would
           file a fifth of the deck under the wrong heading, in the unit
           filter, in the group headings and in the mastery dashboard alike.
           The record's own code is the fallback for the 228 parts that carry
           none, and 26 parts end up genuinely unmapped. */
        var unit = unitOf((p.primary_codes || [])[0] || (p.secondary_codes || [])[0] || q.primary_code);

        var partRedacted = HAS_REDACTION.test(p.text || "");
        if (partRedacted) STATS.redacted++;
        /* The stem of a parsed MCQ is the question minus its options: the
           options are about to be rendered as buttons and would otherwise
           be read twice. */
        var text = mcq ? mcq.stem : tidyPart(p.label, p.text);

        /* The level-band descriptors, which are what markschemeOf returns
           (dispatch config decision 3 and 6). Two pieces of cleaning:
           · the band text opens by repeating the question verbatim, and the
             pupil has the question on screen directly above it, so a leading
             exact repeat is dropped;
           · 94 parts have under 30 characters of scheme (one is the single
             token "[2]"), which is not a markscheme, so they are flagged
             thin and their printed pages open by themselves rather than
             leaving a pupil staring at three characters. Every one of those
             parts does have a printed markscheme crop or page, so nothing is
             left without an authority to mark against. */
        var band = stripTokensInScheme(p.markscheme_text).replace(/\s+/g, " ").trim();
        if (text && text.length >= 20 &&
            band.toLowerCase().indexOf(text.toLowerCase()) === 0) {
          band = band.slice(text.length).trim();
        }
        var bandInfo = band.replace(/\[[^\]]*\]/g, "").replace(/[^A-Za-z0-9]+/g, " ").trim();
        var bandThin = bandInfo.length < 25;
        if (bandThin) STATS.bandsThin++;

        questions.push(Object.assign({}, common, {
          id: id,
          unit_code: unit,
          unit_label: UNIT_FRIENDLY[unit],
          part_label: single ? "" : (label || ("part " + (i + 1))),
          is_part: !single,
          part_index: i,
          marks: hasMarks ? marks : null,
          marks_known: hasMarks,
          question_type: p.question_type || UNCLASSIFIED,
          question_type_label: QTYPE_LABEL[p.question_type || UNCLASSIFIED] || (p.question_type || UNCLASSIFIED),
          ao_focus: p.ao_focus || UNCLASSIFIED,
          diagram_type: p.diagram_type || "",
          calculation_type: p.calculation_type || "",
          rwe_required: p.rwe_required || "",
          hl_only: p.hl_only || "",
          syllabus_items: codes,
          part_text: text,
          part_redacted: partRedacted,
          part_figure_omitted: !!p.has_figure_omitted || HAS_FIGURE.test(p.text || ""),
          markscheme_text: String(p.markscheme_text || "").trim(),
          band_text: band,
          band_thin: bandThin,
          examiner_comment: String(p.examiner_comment || "").trim(),
          mcq_choices: mcq ? mcq.choices : null,
          mcq_key: mcq ? mcq.key : "",
          crops: (p.crops || []).map(function (f) { return cropUrl(q.preview, f); }),
          ms_crops: (p.ms_crops || []).map(function (f) { return cropUrl(q.preview, f); }),
          ms_pages: (p.ms_pages || []).map(function (f) { return pageUrl(q.preview, f); }),
          page_url: qPages.length ? qPages[0] : null
        }));
      });
    });

    /* =================================================================
       CONFIG
       ================================================================= */
    var SERIES_ORDER = { May: 0, Nov: 1 };

    window.PPQ_CONFIG = {
      title: "IB Economics driller",
      versionLabel: "economics v0.1.0 (teacher preview) · engine " + (window.PPQViewer ? window.PPQViewer.version : "?"),
      appVersion: "economics-teacher-preview",
      storageKey: "economics_ppq_v1",
      learnerId: "teacher-preview",
      timingMode: "none",
      prefetchAhead: 2,
      defaultOrder: "shuffle",
      questionFinder: true,

      /* Timing: the same shape and the same defaults as ibmaths.html —
         off unless the pupil turns it on, no new modes, pacing derived
         from marks. The per-mark rate is the IB Economics assessment
         outline: HL/SL Paper 1 75 min for 25 marks (180 s/mark), Paper 2
         105 min for 40 marks (157.5 s/mark), HL Paper 3 105 min for 60
         marks (105 s/mark). NOTE: unlike the maths rates, which came
         from the guide Smith supplied, these are not corroborated by
         anything in the corpus — flagged to the architect. Nothing is
         shown to a pupil while defaultMode is "none". */
      timing: {
        targetOf: function (q) {
          var perMark = q.paper === "3" ? (105 * 60 / 60) : (q.paper === "2" ? (105 * 60 / 40) : (75 * 60 / 25));
          return (q.marks || 1) * perMark;
        },
        defaultMode: "none"
      },

      filters: [
        { field: "level", label: "level", allLabel: "HL and SL",
          values: ["HL", "SL", "HLSL"], friendlyLabels: LEVEL_LABEL },
        { field: "paper", label: "paper", allLabel: "All papers",
          values: ["1", "2", "3"], friendlyLabels: PAPER_LABEL },
        /* d020, and dispatch config decision 8: default to the subset a
           pupil can still be examined on. Multi-select so `out` stays
           reachable deliberately rather than being invisible. The status
           is also said on the question itself (noticesOf), not only in
           this control. */
        { field: "spec_status", label: "syllabus", allLabel: "On the syllabus now",
          values: ["current", "mixed", "out"], multi: true,
          default: ["current", "mixed"],
          friendlyLabels: SPEC_LABEL, positiveValues: ["current"] },
        { field: "unit_code", label: "unit", allLabel: "All four units",
          values: ["1", "2", "3", "4", UNMAPPED], friendlyLabels: UNIT_FRIENDLY },
        /* The finest grain the catalogue can name. Hidden until a unit is
           chosen, because the whole-corpus list is 417 syllabus items. */
        { field: "syllabus_items", label: "syllabus content", allLabel: "All content in these questions",
          dependsOn: "unit_code", hideUntilParent: true, dashboardFacet: true,
          friendlyLabels: ITEM_NAMES },
        { field: "question_type", label: "type", allLabel: "All question types",
          friendlyLabels: QTYPE_LABEL },
        { field: "ao_focus", label: "skill", allLabel: "All assessment objectives",
          friendlyLabels: AO_LABEL },
        { field: "year", label: "year", allLabel: "All years" }
      ],

      /* Dispatch config decision 11. Every axis is one a pupil could act
         on, and every one of them renders a name rather than a code. */
      progressAxes: [
        { key: "unit", label: "By syllabus unit", valuesOf: function (q) { return [q.unit_code]; },
          labelOf: function (v) { return UNIT_FRIENDLY[v] || v; } },
        { key: "item", label: "By syllabus content", valuesOf: function (q) { return q.syllabus_items; },
          labelOf: shortCodeLabel },
        { key: "qtype", label: "By question type", valuesOf: function (q) { return [q.question_type]; },
          labelOf: function (v) { return QTYPE_LABEL[v] || v; } },
        { key: "ao", label: "By assessment objective", valuesOf: function (q) { return [q.ao_focus]; },
          labelOf: function (v) { return AO_LABEL[v] || v; } },
        { key: "paper", label: "By paper", valuesOf: function (q) { return [q.paper]; },
          labelOf: function (v) { return PAPER_LABEL[v] || v; } },
        { key: "level", label: "By level", valuesOf: function (q) { return [q.level]; },
          labelOf: function (v) { return LEVEL_LABEL[v] || v; } },
        { key: "year", label: "By year", valuesOf: function (q) { return [q.year]; } },
        { key: "spec", label: "By syllabus status", valuesOf: function (q) { return [q.spec_status]; },
          labelOf: function (v) { return SPEC_LABEL[v] || v; } }
      ],

      idOf: function (q) { return q.id; },
      sort: function (a, b) {
        return (a.year_num - b.year_num) ||
          ((SERIES_ORDER[a.series] || 0) - (SERIES_ORDER[b.series] || 0)) ||
          String(a.time_zone).localeCompare(String(b.time_zone)) ||
          String(a.paper).localeCompare(String(b.paper)) ||
          (parseInt(a.question, 10) - parseInt(b.question, 10)) ||
          (a.part_index - b.part_index);
      },
      groupKey: function (q) { return q.unit_code === UNMAPPED ? "UT_unmapped" : q.unit_code; },
      groupLabel: function (q) {
        return q.unit_code === UNMAPPED ? "Not yet mapped to a syllabus unit" : UNIT_FRIENDLY[q.unit_code];
      },
      isUntagged: function (k) { return String(k).indexOf("UT_") === 0; },
      dashboardTitle: "Syllabus mastery",
      dashboardLayout: "single",
      analysisReminderGroup: true,

      metaLine: function (q) {
        return (LEVEL_LABEL[q.level] || q.level) +
          " · " + paperKindOf(q) +
          " · " + q.series + " " + q.year + (q.time_zone ? " " + q.time_zone : "") +
          " · Q" + q.question + (q.part_label ? " " + q.part_label : "") +
          " · " + (q.marks_known ? (q.marks + " mark" + (q.marks === 1 ? "" : "s")) : "marks not recorded") +
          /* Only claim the whole-question total on a part, and only when
             every part's marks survived, so the total is the printed one. */
          (q.is_part && q.question_marks && q.question_marks_complete
            ? " (of " + q.question_marks + " for the whole question)" : "");
      },

      /* Default chips stay thin (six-faults #1, "categories are a mile
         thick"): the unit, what kind of question this is, and the two
         things that change how you answer it. The syllabus items live
         behind the More classifications expander. */
      tagsOf: function (q) {
        var t = [q.unit_label, q.question_type_label];
        if (q.diagram_type) t.push("Diagram: " + q.diagram_type);
        if (q.calculation_type) t.push("Calculation: " + q.calculation_type);
        if (q.rwe_required === "yes") t.push("Needs a real-world example");
        if (q.hl_only === "yes") t.push("HL only");
        return t.filter(Boolean);
      },
      classificationsOf: function (q) {
        return {
          syllabus: (q.syllabus_items || []).map(codeLabel),
          techniques: [q.question_type_label],
          representations: [AO_LABEL[q.ao_focus] || q.ao_focus]
        };
      },
      searchTermsOf: function (q) {
        return [q.id, q.block_id, q.year, q.series, q.time_zone, "Paper " + q.paper, q.level,
          q.question_type_label, q.unit_label].concat((q.syllabus_items || []).map(codeName));
      },

      /* The stem reads first as the shared context, then this part's own
         text. Each block says what it is and stands apart, and where the
         transcription lost a figure it says so rather than leaving a
         silent gap that the reader cannot interpret. The printed pages
         above the text are the authority throughout. */
      questionTextOf: function (q) {
        var bits = [];
        if (q.stem_text) {
          bits.push('<div class="ib-block"><div class="ib-block-label">The question says</div>' +
            '<div class="ib-stem">' + escHtml(q.stem_text) + "</div>" +
            (OMITTED_RE.test(q.stem_text)
              ? '<div class="ib-omitted">A figure, table or chart here is not in the transcription. It is in the printed page above.</div>'
              : "") + "</div>");
        }
        var head = (q.part_label ? q.part_label : "This question") +
          (q.marks_known ? (", " + q.marks + " mark" + (q.marks === 1 ? "" : "s")) : "") + " asks";
        var body = q.part_text
          ? '<div class="ib-part">' + escHtml(q.part_text) + "</div>"
          /* No silent gap: 49 parts lost their whole text to the IB's own
             copyright redaction of the published paper. Say what happened. */
          : (q.part_redacted
            ? '<div class="ib-gone">The published paper has this question\'s wording removed for copyright reasons, so there is no transcription. The printed page above is all that survives.</div>'
            : '<div class="ib-gone">No transcription survives for this part. Work from the printed page above.</div>');
        bits.push('<div class="ib-block"><div class="ib-block-label">' + escHtml(head) + "</div>" + body +
          (OMITTED_RE.test(q.part_text || "")
            ? '<div class="ib-omitted">A figure, table or chart here is not in the transcription. See the printed page above.</div>'
            : "") + "</div>");
        return bits.join("");
      },

      /* Things a pupil must know BEFORE working (d020). Ordered by what
         would most change what they do. Note the engine drops a notice
         with no `text`, so every notice here carries one. */
      noticesOf: function (q) {
        var out = [];
        if (q.spec_status === "out") {
          out.push({ tone: "warn", label: "Off the current syllabus.",
            text: "Kept for practice: the economics is still worth doing, but this content will not be examined." });
        } else if (q.spec_status === "mixed") {
          out.push({ tone: "info", label: "Partly off the current syllabus.",
            text: "The topic survives, but the wording or the emphasis has changed since this paper was set." });
        }
        if (q.part_redacted || q.stem_redacted) {
          out.push({ tone: "warn", label: "Some of this question is missing.",
            text: "The IB removed source material from the published version of this paper for copyright reasons, so part of it does not exist to be shown." });
        }
        if (!q.marks_known) {
          out.push({ tone: "info", label: "Mark allocation unknown.",
            text: "The printed marks for this part did not survive extraction, so there is no marks bar. Read the markscheme's bands and mark it yourself." });
        }
        /* 7 of the 80 legacy multiple-choice items have an option list that
           the extractor scrambled (option tables read bottom-to-top, or a
           list cut off part-way). They are not offered as clickable options,
           and the pupil is told why rather than left to wonder what the
           jumbled letters in the transcription are. */
        if (q.question_type === "multiple_choice" && !q.mcq_choices) {
          out.push({ tone: "info", label: "Read this one from the printed page.",
            text: "The four options did not come through the transcription in a usable order. The printed question above is complete; answer from that, then mark yourself against the answer in the markscheme." });
        }
        return out;
      },

      /* ===== d016 / dispatch config decision 4: chemistry's part model.
         The block is the printed question; the units within it are the
         part chips and the whole-question view. ===== */
      blockKeyOf: function (q) { return q.block_id || q.id; },
      paperCodeOf: function (q) { return q.preview; },
      partLabelOf: function (q) { return q.part_label || "(whole)"; },
      partMarksOf: function (q) { return q.marks; },

      /* ===== Question type routing (dispatch config decision 2) =====
         Routing keys on question_type, NOT on self_mark: the catalogue
         sets self_mark "level_band" on all 3,498 parts including the
         multiple-choice ones, so self_mark cannot tell them apart.
         · a parsed multiple-choice item auto-marks (mcq)
         · a part whose printed marks did not survive extraction has no
           honest marks bar to draw, so it reveals the bands and records
           no graded attempt (flashcard). 127 parts, all Paper 2 and
           Paper 3, 2005–2013 plus one 2018. Rendering the engine's
           fallback 0–1 bar on what the markscheme shows to be a 2-mark
           definition would be the viewer telling a pupil something
           untrue, which is the one thing it may not do.
         · everything else is marks-based self-assessment. */
      questionType: function (q) {
        if (q.mcq_choices) return "mcq";
        if (!q.marks_known) return "flashcard";
        return "marksSelfAssess";
      },
      choicesOf: function (q) { return q.mcq_choices || []; },
      answerKeyOf: function (q) { return q.mcq_key || ""; },
      correctOf: function (q) { return q.mcq_key || ""; },
      marksOf: function (q) { return q.marks; },

      cropsOf: function (q) { return q.crops || []; },
      stemUrlOf: function (q) { return q.page_url; },
      /* d018: the stem as printed. Every economics question has printed
         question pages, and on a data-response paper they are the only
         faithful account of the extract's tables and charts. */
      stemPagesOf: function (q) { return q.question_pages_all || []; },
      answerUrlOf: function () { return null; },

      msCropsOf: function (q) { return q.ms_crops || []; },
      /* The seat located the markscheme pages per PART, so the reveal
         opens on this part's own pages rather than the paper's cover. */
      msPagesOf: function (q) { return q.ms_pages || []; },
      msPagesAllOf: function (q) { return q.ms_pages_all || []; },
      /* Open the printed pages unasked when there is no crop to read, or when
         the transcribed bands are too thin to be the whole scheme. */
      msPagesOpenOf: function (q) { return !!q.band_thin || !(q.ms_crops && q.ms_crops.length); },
      msPagesLabelOf: function (q) {
        var n = (q.ms_pages || []).length;
        if (!n) return "";
        return "Show the markscheme" + (n > 1 ? " (" + n + " pages)" : "");
      },

      /* ===== Level bands (dispatch config decision 3 and 6) =====
         Economics has no discrete mark points anywhere: every part, down
         to a 2-mark "define", is scored against its own 0..N mark-scheme
         level band, and the band descriptors ARE markscheme_text
         (catalogue contract, accepted extensions). The existing marks
         bar is therefore the right widget and no parallel one is built.

         The engine passes this through _formatMarkscheme() straight into
         innerHTML without escaping, so it is escaped here. The band text
         opens by repeating the question verbatim; where it does, the
         repeat is dropped, because the pupil has the question on screen
         directly above it. */
      markschemeOf: function (q) {
        var hasImages = (q.ms_crops && q.ms_crops.length) || (q.ms_pages && q.ms_pages.length);
        if (q.band_thin) {
          /* Do not present three characters as though they were the marking
             bands. Say what is there and send the pupil to the printed
             scheme, which msPagesOpenOf has already opened. */
          return "<i>The transcribed markscheme for this part is too short to be the whole scheme" +
            (hasImages ? ", so the printed markscheme is open below." : ".") + "</i>" +
            (q.band_text ? '<div class="ib-band">' + escHtml(q.band_text) + "</div>" : "");
        }
        return '<div class="ib-band">' + escHtml(q.band_text) + "</div>";
      },
      /* Shown WITH the markscheme, not before the question: it explains
         the scheme, and a pupil only needs it at the reveal. 883 of the
         1,021 records are marked under conventions that are not the
         current ones, so without this the bands look broken and the
         pupil stops trusting the reveal (dispatch config decision 6). */
      markschemeNoteOf: function (q) {
        return q.marking_differs === "yes" ? (q.marking_note || "") : "";
      },

      /* Examiner panel, default-on, mirroring the maths shape: this
         part's own commentary leads, and the paper-level subject report
         sits behind a closed details block so the reveal stays
         uncluttered (dispatch config decision 7).
         NOTE the shape: maths has meta.paper_reports[preview] holding
         the three fields directly, economics has one more level —
         meta.paper_reports[preview][section] where section is
         "paper_one_b" / "paper_two" / "paper_three". Always exactly one
         section per preview, so it is unwrapped here. */
      examinerOf: function (q) {
        var bits = [];
        if (q.examiner_comment) {
          bits.push('<div class="ib-ex-comment">' + escHtml(q.examiner_comment) + "</div>");
        }
        var pr = q.paper_report;
        if (pr) {
          var keys = Object.keys(pr);
          var sec = keys.length ? pr[keys[0]] : null;
          if (sec) {
            var inner = "";
            if (sec.general_comments) inner += "<p><b>In general:</b> " + escHtml(sec.general_comments) + "</p>";
            if (sec.difficult_areas) inner += "<p><b>Found difficult:</b> " + escHtml(sec.difficult_areas) + "</p>";
            if (sec.well_prepared_areas) inner += "<p><b>Well prepared:</b> " + escHtml(sec.well_prepared_areas) + "</p>";
            if (inner) {
              bits.push('<details class="ib-ex-paper"><summary>What examiners said about this whole paper</summary>' +
                inner + "</details>");
            }
          }
        }
        return bits.join("");
      },

      selfAssess: {
        /* Dispatch config decision 13: the engine's generic
           post-question flow, with no invented economics vocabulary.
           Economics' real vocabulary is parts[].criteria (populated on
           1,185 parts, frozen set in meta.essay_criteria), which is
           explicitly out of scope here: it needs the tick-what-you-got
           surface that the architect is building once, for economics and
           maths together. Nothing is approximated in the meantime. */
        taxonomy: [],
        /* The question's own content, named, as one-click weak-area
           chips. Not invented vocabulary — it is this part's syllabus
           items read back through code_names. */
        weakAreasOf: function (q) {
          return (q.syllabus_items || []).map(function (c) {
            return { value: c, label: "Not solid: " + shortCodeLabel(c), weak: false };
          });
        }
      },

      attemptFields: function (q) {
        return {
          block_id: q.block_id, part_label: q.part_label || "",
          year: q.year, series: q.series, time_zone: q.time_zone,
          paper: q.paper, level: q.level, question: q.question,
          unit_code: q.unit_code, question_type: q.question_type, ao_focus: q.ao_focus,
          spec_status: q.spec_status, marks_max: q.marks
        };
      },
      selfReport: { levels: 6, prompt: "How did that feel? (1 = lost, 6 = easy)" },
      /* No analysisOf and no feedbackStatusOf: with no feedback source
         the readiness badge hides entirely rather than stamping every
         question with a status it cannot support. */
      modules: { postQuestionReview: true, structuredPaper: true }
    };

    /* Exposed for the suite, and useful in the console: the counts that
       the build note reports and that must not drift silently. */
    window.ECON_BUILD_STATS = STATS;
    window.ECON_VIEWER_RECORDS = questions;

    PPQViewer.mount(document.getElementById("ppq-root"), {
      config: window.PPQ_CONFIG,
      questions: questions,
      meta: META
    });
  })();
  </script>
</body>
</html>
