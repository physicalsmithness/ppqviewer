<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ESAT PPQ — shared ppqviewer (comparison copy)</title>
  <!-- GA4 — estate standard (WEB_KIT) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-WKYGJYERSR"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-WKYGJYERSR');
  </script>
  <!-- Microsoft Clarity — estate standard (WEB_KIT) -->
  <script type="text/javascript">
  (function(c,l,a,r,i,t,y){c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);})(window,document,"clarity","script","xdr2tsc688");
  </script>
  <link rel="stylesheet" href="../engine/ppqviewer.css">
  <style>
    body { margin: 0; background: #faf6ed; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    /* QoderWork 2026-07-22: ESAT questions come through too big — shrink figures */
    .ppq { --ppq-crop-width: 78%; }
    #sign-in-gate { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; gap: 1rem; }
    #sign-in-gate h2 { margin: 0; color: #1a1a17; }
    #sign-in-gate input, #sign-in-gate select { padding: 0.5rem 1rem; font-size: 1rem; border: 1px solid #ccc; border-radius: 6px; width: 220px; background: #fff; color: #1a1a17; }
    #sign-in-gate button { padding: 0.5rem 2rem; font-size: 1rem; background: #3182ce; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    #sign-in-gate button:hover { background: #2b6cb0; }
    #sign-in-gate .hint { font-size: 0.85rem; color: #8c8579; }
    #ppq-root { display: none; }
    #report-flash { position: fixed; bottom: 12px; right: 12px; font-size: 0.75rem; color: #48bb78; opacity: 0; transition: opacity 0.3s; }
  </style>
</head>
<body>

  <!-- Estate shared sign-in gate (QoderWork 2026-07-22): same lightweight login
       the physics drillers use — shared identity, class chosen from a supplied
       list, every answer pulses to the one shared workbook. Not an assessment
       login (the real account tier is still to come). -->
  <div id="sign-in-gate">
    <h2>ESAT Past-Paper Viewer</h2>
    <p class="hint">Shared ppqviewer engine, comparison copy</p>
    <input id="si-name" placeholder="Your name" autocomplete="name">
    <select id="si-class"></select>
    <button id="si-start">Start</button>
    <p class="hint">Sign in with the same name you use for the other drillers. Your class pulse goes to the shared teacher tracker.</p>
  </div>

  <!-- One mount; the shared engine draws everything inside (d003). -->
  <div id="ppq-root"></div>
  <div id="report-flash"></div>

  <!-- ESAT question catalogue -->
  <script src="../../ESAT Prep App/app/data/esat_catalogue.js"></script>
  <!-- ESAT analysis store (d028) — powers the post-question interrogation.
       Plain script tags (no fetch) so it works from file://. -->
  <script src="../../ESAT Prep App/data/analysis/esat_engaa_2016_s1.js"></script>
  <script src="../../ESAT Prep App/data/analysis/esat_nsaa_2016_s1.js"></script>
  <script src="../../ESAT Prep App/data/analysis/esat_engaa_2017_s1.js"></script>
  <script src="../../ESAT Prep App/data/analysis/esat_nsaa_2017_s1.js"></script>
  <script src="../../ESAT Prep App/data/analysis/esat_nsaa_2018_s1.js"></script>
  <!-- QoderWork 2026-07-22 (analyst handoff): analysis-v2 bundle. Exposes
       window.ESAT_ANALYSIS_V2 = { schema_version, interaction_defaults, records[],
       by_id{} }. Preferred over the legacy store above when a record exists; the
       legacy store remains as the migration fallback. Do not edit the bundle —
       it is generated by analysis_v2/scripts/build_ppqviewer_bundle.py. -->
  <script src="../../../CodexProjects/PaperDatabases/Esat Categorisation/analysis_v2/dist/esat_analysis_v2.js"></script>
  <!-- Provisional first-pass subtopic classifications. Kept separate from the
       official catalogue so rerouting suggestions remain visible and reversible. -->
  <script src="../../../CodexProjects/PaperDatabases/Esat Categorisation/analysis_v2/dist/esat_classification.js"></script>
  <!-- The shared engine (must load before the mount call below) -->
  <script src="../engine/ppqviewer.js"></script>
  <!-- Estate shared sign-in + pulse (QoderWork 2026-07-22) -->
  <script src="ppq-login.js"></script>

  <!-- Config + reporting wiring (QoderWork 2026-07-22) -->
  <script>
  (function () {
    "use strict";
    var ESAT_BASE = "file:///C:/Claude (not on Gdrive, nor OneDrive)/ESAT Prep App/app/";

    /* ===== Estate shared sign-in + pulse (ppq-login.js) =====
       Same lightweight login the physics drillers use: shared identity
       (smithics_fields_identity_v1, so the name prefills across drillers), class
       chosen from a supplied dropdown, and every answer pulses to the one shared
       workbook under project "ppqviewer_esat". The ESAT class is held scoped (its
       own key) so it never clobbers a pupil's physics class.
       INTERIM class list below — Smith to supply the real ESAT class names, then
       swap to the TeacherViewer M2 single-source doGet when it ships. */
    var INTERIM_CLASSES = ["Test", "Y12 ESAT", "Y13 ESAT"];

    /* QoderWork 2026-07-22: populate the class dropdown FIRST, before anything
       that can fail, so it is NEVER blank. A tester must always be able to pick
       a class and get in, even if the estate login script did not load. */
    (function populateClasses() {
      var sel = document.getElementById("si-class");
      if (!sel) return;
      sel.innerHTML = "";
      var ph = document.createElement("option"); ph.value = ""; ph.textContent = "Choose your class\u2026";
      sel.appendChild(ph);
      INTERIM_CLASSES.forEach(function (c) { var o = document.createElement("option"); o.value = c; o.textContent = c; sel.appendChild(o); });
    })();

    /* QoderWork 2026-07-22: the estate login is optional. If ppq-login.js loaded
       we use it (shared identity + pulse to the teacher tracker); if it did not
       (e.g. the page was opened without its folder) we fall back to a minimal
       local sign-in so nobody is blocked at the gate. */
    var login = null;
    if (window.PPQLogin && window.PPQLogin.createLogin) {
      login = window.PPQLogin.createLogin({
        projectTag: "ppqviewer_esat",
        cohortKey: "ppqviewer_esat_cohort_v1",
        classes: INTERIM_CLASSES,
        onStatus: function (msg) { flash(msg); }
      });
    }
    function report(partial) { if (login) login.report(partial); }

    function flash(msg) {
      var el = document.getElementById("report-flash");
      if (!el) return;
      el.textContent = msg; el.style.opacity = "1";
      setTimeout(function () { el.style.opacity = "0"; }, 1500);
    }

    if (login) {
      /* Already signed in on this browser (shared name + an ESAT class)? Straight in. */
      if (login.signedIn()) { enterApp(); }

      login.wireGate({
        name: document.getElementById("si-name"),
        classSelect: document.getElementById("si-class"),
        start: document.getElementById("si-start")
      }, function () { enterApp(); });
    } else {
      /* QoderWork 2026-07-22: fallback gate — ppq-login.js did not load (page
         opened without its folder). Wire the Start button locally so the tester
         can still get in. The name is remembered locally so it prefills next
         time; no pulse goes to the teacher tracker in this mode. */
      var FALLBACK_NAME_KEY = "ppqviewer_esat_fallback_name";
      var nameEl = document.getElementById("si-name");
      var classEl = document.getElementById("si-class");
      var startEl = document.getElementById("si-start");
      try { var remembered = localStorage.getItem(FALLBACK_NAME_KEY); if (nameEl && remembered) nameEl.value = remembered; } catch (e) {}
      if (startEl) startEl.addEventListener("click", function () {
        var name = nameEl ? nameEl.value.trim() : "";
        var cls = classEl ? classEl.value : "";
        if (!name) { if (nameEl) nameEl.focus(); return; }
        if (!cls) { if (classEl) classEl.focus(); return; }
        try { localStorage.setItem(FALLBACK_NAME_KEY, name); } catch (e) {}
        enterApp();
      });
    }

    function enterApp() {
      document.getElementById("sign-in-gate").style.display = "none";
      document.getElementById("ppq-root").style.display = "block";
      /* QoderWork 2026-07-22: if the engine itself did not load (page opened
         without its folder), say so plainly instead of failing silently. */
      if (!window.PPQViewer) {
        document.getElementById("ppq-root").innerHTML =
          '<div style="max-width:34rem;margin:3rem auto;padding:1.5rem;border:1px solid #ddd;border-radius:10px;font-family:system-ui,sans-serif;color:#333">' +
          '<h2 style="margin-top:0">The viewer engine did not load</h2>' +
          '<p>This page needs to be opened from inside its <b>ppqviewer</b> folder ' +
          '(it loads <code>engine/ppqviewer.js</code> and the question data by relative path). ' +
          'If you received just this one file, ask for the full folder and open it from there.</p></div>';
        return;
      }
      mountViewer();
    }

    /* ===== Config ===== */
    function mountViewer() {
      var META = window.ESAT_META || {};
      var topicName = {};
      (META.topics || []).forEach(function (t) { topicName[t.code] = t.name; });
      var subjectLabels = { maths: "Maths", physics: "Physics", chemistry: "Chemistry", biology: "Biology" };
      var topicFriendly = {};
      (META.topics || []).forEach(function (t) { topicFriendly[t.code] = t.code + " " + t.name; });

      function baseRecordIdOf(q) {
        if (!q || !q.slug) return "";
        var nn = String(parseInt(q.question_number, 10));
        nn = nn.length < 2 ? "0" + nn : nn;
        return q.slug + "_Q" + nn;
      }
      function recordIdOf(q) {
        var base = baseRecordIdOf(q);
        return base + (q && q.part ? ("_" + q.part) : "");
      }

      /* Overlay the bounded classification passes without changing the official
         broad-topic catalogue. A reroute stays in its current topic for now, but
         the filter and question tags say clearly where the first pass would move
         it. Later passes can replace this generated bundle without viewer edits. */
      var CLASSIFICATION = window.ESAT_CLASSIFICATION || {};
      var CLASSIFICATION_BY_ID = CLASSIFICATION.by_id || {};
      var CLASSIFICATION_SWEEPS = CLASSIFICATION.sweep_topics || {};
      (window.ESAT_QUESTIONS || []).forEach(function (q) {
        var rec = CLASSIFICATION_BY_ID[recordIdOf(q)] || CLASSIFICATION_BY_ID[baseRecordIdOf(q)];
        if (!rec) return;
        var sweep = CLASSIFICATION_SWEEPS[rec.source_sweep] || {};
        var expectedCodes = sweep.topic_codes || [];
        var sourceTopicMismatch = expectedCodes.length && expectedCodes.indexOf(q.topic_code) < 0;
        var needsMove = !!rec.reclassification_flag || !!sourceTopicMismatch;
        var moveTarget = rec.reclassification_target || sweep.label || "another topic";
        q.classification = rec;
        q.classification_needs_move = needsMove;
        q.classification_target = moveTarget;
        /* A completed multi-label sidecar owns the compact pupil-facing family
           name. The retained sweep primary remains in the searchable membership
           array, so this improves the RHS hierarchy without discarding any older
           classification evidence. */
        q.classification_family =
          rec.multilabel_source_primary_subtopic || rec.primary_subtopic;
        q.classification_subtopic = needsMove
          ? ("Needs moving \u2192 " + moveTarget)
          : q.classification_family;
        /* Keep every useful classification axis. A question may legitimately
           appear under more than one subtopic; the shared engine now matches
           array-valued filters by membership rather than forcing one bucket. */
        q.classification_subtopics = [];
        [q.classification_subtopic, q.classification_family, rec.primary_subtopic]
          .concat(rec.syllabus_subtopics || [])
          .concat(rec.secondary_subtopics || [])
          .concat(rec.also_seen_in || [])
          .forEach(function (value) {
            if (value && q.classification_subtopics.indexOf(value) < 0) q.classification_subtopics.push(value);
          });
        q.classification_tags = [];
        (rec.technique_tags || []).concat(rec.representation_tags || []).concat(rec.filter_tags || [])
          .forEach(function (value) {
            if (value && q.classification_tags.indexOf(value) < 0) q.classification_tags.push(value);
          });
      });

      /* ===== Post-question interrogation: index the analysis store (d028) =====
         Analysis records are keyed by id "slug_Qnn" (optionally "_part"). Catalogue
         questions are keyed "slug|number|part". Map one onto the other. The generated
         deep-v2 bundle now spans hundreds of questions; anything still absent returns
         null and the engine supplies the generic guess/feedback/rating screen. */
      var ANALYSIS = {};
      [window.ESAT_ANALYSIS_ENGAA2016, window.ESAT_ANALYSIS_NSAA2016,
       window.ESAT_ANALYSIS_ENGAA2017, window.ESAT_ANALYSIS_NSAA2017,
       window.ESAT_ANALYSIS_NSAA2018].forEach(function (arr) {
        if (!arr) return;
        arr.forEach(function (rec) { if (rec && rec.id) ANALYSIS[rec.id] = rec; });
      });
      function analysisOf(q) {
        if (!q || !q.slug) return null;
        var base = baseRecordIdOf(q);
        /* QoderWork 2026-07-22 (analyst handoff): PREFER the analysis-v2 record
           (by_id) when it exists; fall back to the legacy analysis store for
           questions not migrated yet; otherwise null → generic feedback fallback. */
        var V2 = window.ESAT_ANALYSIS_V2;
        if (V2 && V2.by_id) {
          if (q.part && V2.by_id[base + "_" + q.part]) return V2.by_id[base + "_" + q.part];
          if (V2.by_id[base]) return V2.by_id[base];
        }
        if (q.part && ANALYSIS[base + "_" + q.part]) return ANALYSIS[base + "_" + q.part];
        return ANALYSIS[base] || null;
      }

      /* Keep the pupil-facing topic dashboard at the stable family level. The
         full classification_subtopics array remains on each question and is what
         the shared engine matches, so one question may still belong to several
         displayed families. Raw secondary/also-seen labels do not become hundreds
         of uncurated rows in the right-hand panel. */
      function stableClassificationFamilies(source) {
        var seen = {};
        (source || []).forEach(function (q) {
          var rec = q.classification || {};
          var family = q.classification_family ||
            rec.multilabel_source_primary_subtopic ||
            rec.primary_subtopic || "";
          if (family && (q.classification_subtopics || []).indexOf(family) >= 0) {
            seen[family] = true;
          }
        });
        return Object.keys(seen).sort(function (a, b) {
          return a.localeCompare(b, undefined, { numeric: true, sensitivity: "base" });
        });
      }

      window.PPQ_CONFIG = {
        title: "ESAT PPQ (shared engine, comparison)",
        versionLabel: "ppqviewer v0.2.16 · content-safety gate",
        appVersion: "ppqviewer-esat-compare",
        storageKey: "esat_ppq_COMPARE",
        /* QoderWork 2026-07-22: login may be null (fallback gate mode). */
        learnerId: (login ? login.current().display_name : "") || "local",
        timingMode: "none",
        prefetchAhead: 3,

        /* QoderWork 2026-07-22 (v0.2.5): verdicts are ON. Smith corrected the
           v0.2.4 misread — he never said hide right/wrong; the fault was that the
           abstract probe headline came FIRST (now the verdict block leads the
           pop-up). The engine's revealCorrect:false switch still exists for a
           future test mode; ESAT does not set it. */

        /* QoderWork 2026-07-22 (v0.2.4): shuffle is the standard order (Smith). */
        defaultOrder: "shuffle",

        filters: [
          /* QoderWork 2026-07-22 (v0.2.4): subject is a multi-select defaulting to
             Maths + Physics (Smith teaches both now); Chemistry and Biology stay
             choosable from the same dropdown. */
          { field: "subject", label: "subject", allLabel: "All subjects", values: META.subjects, friendlyLabels: subjectLabels, multi: true, default: ["maths", "physics"] },
          { field: "assessment", label: "source", allLabel: "All sources", values: META.assessments },
          { field: "year", label: "year", allLabel: "All years" },
          { field: "topic_code", label: "topic", allLabel: "All topics", values: (META.topics || []).map(function (t) { return t.code; }), friendlyLabels: topicFriendly },
          { field: "classification_subtopics", label: "subtopic", allLabel: "All subtopics", dependsOn: "topic_code", hideUntilParent: true, dashboardFacet: true, values: stableClassificationFamilies },
          { field: "esat_in_spec", label: "spec", allLabel: "In spec + out of spec", values: META.specs, friendlyLabels: { in_spec: "In spec", out_of_spec: "Out of Spec" }, default: "in_spec", positiveValues: ["in_spec"] }
        ],
        /* The initial 613 is the in-spec slice, not the size of the Maths/Physics
           estate. Show both counts, and keep the comparison responsive to every
           other active filter. */
        counterScope: {
          ignoreFilterFields: ["esat_in_spec"],
          label: function (scopeQuestions) {
            var present = {};
            scopeQuestions.forEach(function (q) { if (q.subject) present[q.subject] = true; });
            return ["maths", "physics", "chemistry", "biology"]
              .filter(function (subject) { return present[subject]; })
              .map(function (subject) { return subjectLabels[subject] || subject; })
              .join(" + ");
          }
        },
        questionFinder: true,

        idOf: function (q) { return q.id; },
        sort: function (a, b) {
          return a.slug.localeCompare(b.slug) ||
            (parseInt(a.question_number, 10) - parseInt(b.question_number, 10)) ||
            String(a.part).localeCompare(String(b.part));
        },

        groupKey: function (q) { return q.topic_code ? q.topic_code : ("UT_" + q.subject); },
        groupLabel: function (q) {
          if (q.topic_code) return q.topic_code + " " + (q.topic || topicName[q.topic_code] || "");
          return "Untagged · " + (subjectLabels[q.subject] || q.subject);
        },
        isUntagged: function (k) { return String(k).indexOf("UT_") === 0; },

        dashboardTitle: "Topic mastery",
        dashboardLayout: "single",
        analysisReminderGroup: true,

        metaLine: function (q) {
          var m = (q.slug.match(/_s(\d+)$/) || [])[1];
          return q.assessment + " " + q.year + (m ? (" · S" + m) : "") + " · Q" + q.question_number + (q.part ? (" (" + q.part + ")") : "");
        },
        tagsOf: function (q) {
          var t = [subjectLabels[q.subject] || q.subject];
          if (q.topic) t.push(q.topic_code + " " + q.topic);
          if (q.classification) {
            t.push(q.classification_family ||
              q.classification_subtopic ||
              q.classification.primary_subtopic);
            if (q.classification_needs_move) {
              t.push("Review \u2192 " + q.classification_target);
            }
          }
          if (q.q_type) t.push(q.q_type);
          if (q.esat_in_spec) t.push(q.esat_in_spec === "in_spec" ? "In spec" : "Out of Spec");
          return t;
        },
        classificationsOf: function (q) {
          var rec = q.classification || {};
          var primary = q.classification_family ||
            q.classification_subtopic ||
            rec.primary_subtopic;
          return {
            syllabus: (q.classification_subtopics || []).filter(function (label) {
              return label && label !== primary;
            }),
            techniques: rec.technique_tags || rec.filter_tags || [],
            representations: rec.representation_tags || []
          };
        },

        cropsOf: function (q) {
          if (!q.crops || !q.crops.length) return [];
          return q.crops.map(function (c) { return ESAT_BASE + c; });
        },

        options: { mode: "labels" },
        optionsLeft: true, /* QoderWork 2026-07-22: letter picker in a left rail, no long scroll to answer */
        /* QoderWork 2026-07-22 (v0.2.4): count-UP timer (Smith: "you're counting
           down, no, count up… and just to have a log of how long"). A subtle
           elapsed clock; every answer records time_ms either way. The down mode
           (with banking + forced/tight/ok pressure tags) stays in the engine for
           later if a paced mode is wanted. */
        timer: { mode: "up", prominence: "subtle" },
        correctOf: function (q) { return q.correct_answer || ""; },

        attemptFields: function (q) {
          return { slug: q.slug, question_number: q.question_number, part: q.part, subject: q.subject, topic_code: q.topic_code };
        },

        selfReport: { levels: 6, prompt: "How did that feel? (1 = lost, 6 = easy)" },

        /* Post-question feedback is always available while this module is on.
           Authored analysis enriches the shared guess/reflection/rating shell. */
        analysisOf: analysisOf,
        feedbackStatusOf: function (q) {
          var bundle = window.ESAT_ANALYSIS_V2 || {};
          var byId = bundle.feedback_status_by_id || {};
          return byId[baseRecordIdOf(q)] || null;
        },
        /* VSAFE-01 (Claude 2026-07-28): explicit suppression of records with
           damaged pupil-facing content. The engine's damage heuristics run as
           well (they independently catch five of these seven), but every
           KNOWN-damaged record is pinned here so safety never depends on a
           heuristic. Remove an entry ONLY when the analysis project ships a
           repaired record and the damage scan comes back clean.
           The first five are the analysis owner's RS-01 list
           (PROJECT_CONTROL_2026-07-28.md); the last two were found by the
           viewer damage scan on 2026-07-28 and reported back. */
        contentSafety: {
          heuristics: true,
          withheld: {
            "esat_engaa_2020_s1_Q04": "encoding loss: '?' where minus signs should be ('mass number ?4', '238 ? 206'); marked reviewed/full despite corruption (RS-01)",
            "esat_nsaa_2020_s1_Q25": "same damaged decay-table analysis as engaa_2020_Q04 ('?4', '8 ? 2'); marked reviewed/full despite corruption (RS-01)",
            "esat_nsaa_2023_s1_Q27": "nuclide pre-scripts collapsed to '???X'/'???Z' and lost apostrophes ('helium-3?s'); marked reviewed/full despite corruption (RS-01)",
            "esat_engaa_2023_s1_Q16": "analysis owner lists as damaged/missing mathematical presentation (RS-01); analysis text byte-identical to nsaa_2023_Q36's, suspected missing values in method steps",
            "esat_nsaa_2023_s1_Q36": "analysis owner lists as damaged/missing mathematical presentation (RS-01); analysis text byte-identical to engaa_2023_Q16's, suspected missing values in method steps",
            "esat_engaa_2019_s1_Q12": "found by viewer damage scan 2026-07-28: 'row?s', '?Z = ?10' (Delta and minus lost); marked reviewed; same corruption class as the 2020 pair; reported to analysis owner",
            "esat_nsaa_2019_s1_Q30": "found by viewer damage scan 2026-07-28: byte-identical damaged analysis to engaa_2019_Q12; marked reviewed; reported to analysis owner"
          }
        },
        modules: { postQuestionReview: true },

        /* QoderWork 2026-07-22 (analyst handoff): guess-declaration wording comes
           from the analysts' interaction_defaults (settled labels "I'm guessing" /
           "Actually, it was a guess" + candidate prompts). The engine falls back
           to the same strings if this is absent. */
        guessDefaults: (window.ESAT_ANALYSIS_V2 && window.ESAT_ANALYSIS_V2.interaction_defaults && window.ESAT_ANALYSIS_V2.interaction_defaults.guess_declaration) || null
      };

      PPQViewer.mount(document.getElementById("ppq-root"), {
        config: window.PPQ_CONFIG,
        questions: window.ESAT_QUESTIONS,
        meta: window.ESAT_META,
        report: report
      });
    }
  })();
  </script>
</body>
</html>
